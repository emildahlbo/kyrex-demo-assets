# Henter lisensfrie foto (Unsplash, Pexels, Pixabay) listet i requests/*.tsv inn i repoet.
# Linjeformat: <mål-sti>\t<nedlastings-URL>. Bare bilder, ingen temakode.
name: fetch-photos
on:
  push:
    paths: ['requests/*.tsv', 'requests/search-*.txt', 'tools/search.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Last ned
        run: |
          set -u
          for f in requests/*.tsv; do
            [ -f "$f" ] || continue
            while IFS=$'\t' read -r dest url; do
              [ -z "$dest" ] && continue
              case "$dest" in \#*) continue;; esac
              [ -f "$dest" ] && continue
              mkdir -p "$(dirname "$dest")"
              if curl -fsSL --max-time 60 -A "kyrex-demo-assets" -o "$dest" "$url"; then echo "ok $dest"; else echo "FEIL $dest $url"; rm -f "$dest"; fi
            done < "$f"
          done
      - name: Søk
        run: |
          ls requests/search-*.txt >/dev/null 2>&1 && pip install -q pillow && python3 tools/search.py || true
      - name: Lagre
        run: |
          git config user.name "fetch-photos"
          git config user.email "actions@users.noreply.github.com"
          for d in A B C _search; do [ -e "$d" ] && git add -A "$d"; done; true
          git diff --cached --quiet || (git commit -m "Foto hentet fra requests" && for n in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done)
